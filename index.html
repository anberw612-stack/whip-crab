<style>
:root{--bg:#F3ECE2;--card:#FBF7F1;--line:#D6C7B4;--ink:#2E2A26;--brown:#5B3A29;--muted:#9A8573}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:"ZCOOL KuaiLe","PingFang SC",sans-serif;font-weight:400;font-size:32px;margin:0;color:var(--brown);letter-spacing:2px}
.stats{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--brown)}
.count b{font-size:22px;font-variant-numeric:tabular-nums;color:#C8372D;margin:0 2px}
.btn{font:inherit;font-size:13px;color:var(--brown);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.btn:hover{border-color:#BFAE98}
.meters{display:grid;grid-template-columns:auto 1fr 56px;gap:8px 12px;align-items:center;margin-bottom:12px;font-size:14px;color:var(--brown)}
.anger{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;height:12px}
.anger i{background:#E6DACB;transition:background .15s}
.calm{height:12px;background:#E6DACB;position:relative;overflow:hidden}

.meters .val{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}

#scene{display:block;width:100%;aspect-ratio:680/360}
.whips{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px}

.whip:hover{transform:translateY(-2px);border-color:#BFAE98}
.whip.on{border:3px solid var(--c);padding:8.5px;background:#FFF3EC}
.whip canvas{display:block;width:100%;aspect-ratio:3/1}
.whip .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;gap:4px}
.whip .name{font-weight:600;color:var(--brown);font-size:15px;white-space:nowrap}
.whip .mood{font-size:12px;color:var(--c);white-space:nowrap}
.whip kbd{position:absolute;top:6px;right:8px;font:11px ui-monospace,Menlo,monospace;color:var(--muted)}
.hint{margin:14px 0 0;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:560px){.whips{grid-template-columns:repeat(3,1fr)}h1{font-size:26px}.meters{grid-template-columns:auto 1fr 44px}}

<body>
<div class="wrap">
  <header>
    <h1>抽小螃蟹</h1>
    <div class="stats">
      <span class="count">已抽<b id="hits">0</b>下</span>
      <button class="btn" id="mute" type="button">音效：开</button>
    </div>
  </header>
  <div class="meters">
    <span>生气程度</span><div class="anger" id="anger"><i></i><i></i><i></i><i></i><i></i><i></i></div><span class="val" id="moodLabel"></span>
    <span>消气进度</span><div class="calm"><i id="calm"></i></div><span class="val" id="calmPct">0%</span>
  </div>
  <div class="stage" id="stage"><canvas id="scene"></canvas></div>
  <div class="whips" id="whips"></div>
  <p class="hint">点画面抽一鞭（点哪抽哪）· 数字键 1–6 换鞭子 · 空格连抽</p>
</div>
<script>
(()=>{
const W=680,H=360,D=Math.PI/180,HL=84;
const WHIPS=[
  {id:'cane',   name:'藤条',  mood:'有点烦',bar:'#F2C14E',text:'#B8901F',power:2, knock:5, shake:1, stop:0,  sfx:'啪',   burst:'#FFD23F'},
  {id:'leather',name:'皮鞭',  mood:'不爽',  bar:'#EBA03F',text:'#C9801F',power:4, knock:9, shake:3, stop:30, sfx:'啪！', burst:'#FFD23F'},
  {id:'chain',  name:'铁链',  mood:'很生气',bar:'#E8833A',text:'#D2691E',power:7, knock:15,shake:7, stop:60, sfx:'哐！', burst:'#FFF1B8'},
  {id:'thorn',  name:'带刺鞭',mood:'气炸了',bar:'#D4552F',text:'#C8472A',power:9, knock:17,shake:9, stop:75, sfx:'嘶啪！',burst:'#FFD23F'},
  {id:'zap',    name:'电鞭',  mood:'毁灭吧',bar:'#C8372D',text:'#B32A22',power:12,knock:12,shake:11,stop:95, sfx:'滋啦！',burst:'#BFF4FF'},
  {id:'sm',     name:'SM皮鞭',mood:'恶趣味',bar:'#B0306A',text:'#A8285F',power:6, knock:8, shake:4, stop:45, sfx:'啪～', burst:'#FFC2D6'},
];
const LINES={
  cane:['嗷！','轻点轻点','我错了…','哎哟喂'],
  leather:['啊啊啊！','我改还不行吗','疼疼疼','下次不敢了'],
  chain:['铁的？！','脑壳嗡嗡的','饶命啊','哐的一下…'],
  thorn:['扎扎扎扎！','这次刺在鞭子上了吧…','刺我画对了！别抽了！','呜呜呜'],
  zap:['滋滋滋——','我…我重启一下','CPU 烧了','看到自己骨头了'],
  sm:['这…这是什么鞭子？！','你的爱好好特别','怎么还是粉色的…','不要用这种眼神看我','我只是个写代码的螃蟹','绑着抽也太过分了'],
  combo:['你是真生气了','手不酸吗','喘口气喘口气','我数不过来了'],
  idle:['…还生气吗','我在反省','刺已经修好了','下次一定先检查','能先给我松绑吗…','绳子勒得好紧'],
};
const HANDLE={
  cane:{body:'#8A5A2E',wrap:'#C9A27A',cap:'#5B3A29'},
  leather:{body:'#4A2E20',wrap:'#7A5038',cap:'#2E2A26'},
  chain:{body:'#3B3F45',wrap:'#6F7680',cap:'#2E2A26'},
  thorn:{body:'#4A2E20',wrap:'#7A5038',cap:'#2E2A26'},
  zap:{body:'#1F2433',wrap:'#FFD23F',cap:'#9AA3B2'},
  sm:{body:'#1E1A1C',wrap:'#9C1F52',cap:'#B8BEC6'},
};
const HEART=['.X.X.','XXXXX','XXXXX','.XXX.','..X..'];
function heart(g,x,y,u,c){g.fillStyle=c;HEART.forEach((r,j)=>{for(let i=0;i<5;i++)if(r[i]==='X')g.fillRect(x+i*u,y+j*u,u,u)})}

const lerp=(a,b,t)=>a+(b-a)*t;
const lp=(p,q,t)=>({x:lerp(p.x,q.x,t),y:lerp(p.y,q.y,t)});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eOut=t=>1-Math.pow(1-t,3);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function bez(p0,p1,p2,t){const u=1-t;return{x:u*u*p0.x+2*u*t*p1.x+t*t*p2.x,y:u*u*p0.y+2*u*t*p1.y+t*t*p2.y}}
function sample(P0,C,E,n){
  const pts=[];let s=0,prev=null;
  for(let i=0;i<=n;i++){
    const t=i/n,u=1-t;
    const x=u*u*P0.x+2*u*t*C.x+t*t*E.x,y=u*u*P0.y+2*u*t*C.y+t*t*E.y;
    let tx=2*u*(C.x-P0.x)+2*t*(E.x-C.x),ty=2*u*(C.y-P0.y)+2*t*(E.y-C.y);
    const L=Math.hypot(tx,ty)||1;tx/=L;ty/=L;
    if(prev)s+=Math.hypot(x-prev.x,y-prev.y);
    const p={x,y,tx,ty,s};pts.push(p);prev=p;
  }
  return pts;
}
function at(pts,s){
  for(let i=1;i<pts.length;i++){
    if(pts[i].s>=s){const a=pts[i-1],b=pts[i],k=(s-a.s)/((b.s-a.s)||1);
      return{x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),tx:lerp(a.tx,b.tx,k),ty:lerp(a.ty,b.ty,k)}}
  }
  return pts[pts.length-1];
}
function pathPts(g,pts){g.beginPath();g.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)g.lineTo(pts[i].x,pts[i].y)}

/* ---------- whip drawing ---------- */
function drawHandle(g,Ph,th,id){
  const st=HANDLE[id];
  g.save();g.translate(Ph.x,Ph.y);g.rotate(th);
  g.fillStyle=st.body;g.beginPath();g.roundRect(-4,-10,HL+4,20,8);g.fill();
  g.fillStyle=st.wrap;for(let i=0;i<4;i++)g.fillRect(8+i*13,-9,6,18);
  g.fillStyle=st.cap;g.beginPath();g.roundRect(-10,-12,10,24,4);g.fill();
  g.fillRect(HL-8,-8,8,16);
  if(id==='zap'){g.fillStyle='#6FE3FF';g.fillRect(HL-3,-4,4,8)}
  if(id==='sm'){g.fillStyle='#B8BEC6';g.fillRect(-16,-1.5,6,3);heart(g,-30,-7.5,3,'#FF7FA8')}
  g.restore();
}
function drawLash(g,id,P0,C,E){
  const pts=sample(P0,C,E,56),len=pts[pts.length-1].s;
  g.lineCap='round';g.lineJoin='round';
  if(id==='cane'){
    pathPts(g,pts);g.strokeStyle='#A9743F';g.lineWidth=8;g.stroke();
    g.beginPath();pts.forEach((p,i)=>{const x=p.x+p.ty*2,y=p.y-p.tx*2;i?g.lineTo(x,y):g.moveTo(x,y)});
    g.strokeStyle='#CFA06A';g.lineWidth=2;g.stroke();
    g.strokeStyle='#6E4523';g.lineWidth=3;g.lineCap='butt';
    for(let s=40;s<len-10;s+=46){const p=at(pts,s);g.beginPath();g.moveTo(p.x-p.ty*6,p.y+p.tx*6);g.lineTo(p.x+p.ty*6,p.y-p.tx*6);g.stroke()}
    g.lineCap='round';
  }else if(id==='leather'){
    const n=pts.length-1;
    g.strokeStyle='#5A3A28';
    for(let i=0;i<n;i++){g.beginPath();g.moveTo(pts[i].x,pts[i].y);g.lineTo(pts[i+1].x,pts[i+1].y);g.lineWidth=lerp(8,2.5,i/n);g.stroke()}
    g.strokeStyle='#8A5B3E';g.lineWidth=1.5;
    for(let s=6;s<len*0.8;s+=7){const p=at(pts,s),w=lerp(8,2.5,s/len)/2-0.5;
      g.beginPath();g.moveTo(p.x-p.ty*w-p.tx*2,p.y+p.tx*w-p.ty*2);g.lineTo(p.x+p.ty*w+p.tx*2,p.y-p.tx*w+p.ty*2);g.stroke()}
    const e=pts[pts.length-1];g.strokeStyle='#D8C4A8';g.lineWidth=1.5;
    [-0.45,0.45].forEach(a=>{const c=Math.cos(a),s=Math.sin(a),dx=e.tx*c-e.ty*s,dy=e.tx*s+e.ty*c;g.beginPath();g.moveTo(e.x,e.y);g.lineTo(e.x+dx*12,e.y+dy*12);g.stroke()});
  }else if(id==='chain'){
    let k=0;
    for(let s=4;s<=len;s+=10.5,k++){
      const p=at(pts,s),a=Math.atan2(p.ty,p.tx);
      g.save();g.translate(p.x,p.y);g.rotate(a);
      if(k%2===0){
        g.beginPath();g.ellipse(0,0,8,4.8,0,0,Math.PI*2);g.strokeStyle='#5E656E';g.lineWidth=3.2;g.stroke();
        g.beginPath();g.ellipse(0,0,8,4.8,0,Math.PI*1.1,Math.PI*1.75);g.strokeStyle='#B8BEC6';g.lineWidth=1.2;g.stroke();
      }else{
        g.fillStyle='#5E656E';g.fillRect(-7.5,-1.9,15,3.8);g.fillStyle='#B8BEC6';g.fillRect(-5,-1.2,10,1.1);
      }
      g.restore();
    }
  }else if(id==='thorn'){
    g.fillStyle='#2E2A26';g.strokeStyle='#2E2A26';g.lineWidth=1.5;
    let k=0;
    for(let s=18;s<len-6;s+=17,k++){
      const p=at(pts,s),sd=k%2?-1:1,L=13*(1-0.35*s/len),nx=-p.ty,ny=p.tx;
      g.beginPath();
      g.moveTo(p.x-p.tx*6,p.y-p.ty*6);
      g.lineTo(p.x+sd*nx*L-p.tx*5,p.y+sd*ny*L-p.ty*5);
      g.lineTo(p.x+p.tx*6,p.y+p.ty*6);g.closePath();g.fill();g.stroke();
    }
    pathPts(g,pts);g.strokeStyle='#2E2A26';g.lineWidth=7.5;g.stroke();
    pathPts(g,pts);g.strokeStyle='#5C5550';g.lineWidth=2.5;g.stroke();
  }else if(id==='sm'){
    const dx=E.x-P0.x,dy=E.y-P0.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy,ny=ux,n=7;
    for(let i=0;i<n;i++){
      const f=i/(n-1)-.5,back=Math.abs(f)*14;
      const Ei={x:E.x+nx*f*34-ux*back,y:E.y+ny*f*34-uy*back},Ci={x:C.x+nx*f*12,y:C.y+ny*f*12};
      const tp=sample(P0,Ci,Ei,28),red=i===2||i===4;
      pathPts(g,tp);g.strokeStyle=red?'#9C1F52':'#1E1A1C';g.lineWidth=3;g.stroke();
      if(!red){pathPts(g,tp.slice(0,18));g.strokeStyle='#4A4246';g.lineWidth=1;g.stroke()}
    }
    g.fillStyle='#B8BEC6';g.beginPath();g.arc(P0.x,P0.y,5,0,Math.PI*2);g.fill();
    g.fillStyle='#1E1A1C';g.beginPath();g.arc(P0.x,P0.y,2.2,0,Math.PI*2);g.fill();
  }else if(id==='zap'){
    pathPts(g,pts);g.strokeStyle='#2B3A67';g.lineWidth=6;g.stroke();
    pathPts(g,pts);g.strokeStyle='#7E8FD0';g.lineWidth=2;g.stroke();
    [['#6FE3FF',2.5,7],['#FFF59D',1.2,5]].forEach(([c,w,amp])=>{
      g.beginPath();
      for(let i=0;i<pts.length;i+=3){const p=pts[i],o=i===0?0:rnd(-amp,amp);const x=p.x-p.ty*o,y=p.y+p.tx*o;i?g.lineTo(x,y):g.moveTo(x,y)}
      g.strokeStyle=c;g.lineWidth=w;g.stroke();
    });
    const e=pts[pts.length-1];g.fillStyle='#FFF59D';star(g,e.x,e.y,7,3,4);g.fill();
  }
}
function star(g,x,y,R,r,n){g.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,rr=i%2?r:R;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath()}

/* ---------- state ---------- */
const cv=document.getElementById('scene'),ctx=cv.getContext('2d');
let cur=3,muted=false,hits=0,combo=0,lastHit=-9,forgive=0,stop=0,shakeAmt=0,zapUntil=0,tm=0,last=0,nextIdle=8;
let bubble=null,lastPose=null;
const crab={ox:440,oy:178,x:0,vx:0,y:0,vy:0,sq:0,vsq:0,hurt:0,xeye:0,xray:0,flash:0,pain:0,blinkAt:2.5,blink:0,flag:0,welts:[],blush:0,strug:0,strugAt:3};
const parts=[],bursts=[],trails=[];
const sw={phase:'rest',t:0,from:null,T:null,q:[],dW:.15,dS:.1};
const dH=.06,dR=.36;

/* ---------- poses ---------- */
const tipOf=(Ph,th)=>({x:Ph.x+HL*Math.cos(th),y:Ph.y+HL*Math.sin(th)});
function restPose(){
  const s=Math.sin(tm*1.7),heavy=WHIPS[cur].id==='chain'?6:0;
  return{Ph:{x:90,y:178},th:-30*D+s*0.02,C:{x:228+Math.sin(tm*1.7+1)*3,y:165},E:{x:226+s*5,y:300+heavy},a:52*D+s*1.5*D,L:250,bend:0};
}
function windPose(){return{Ph:{x:80,y:172},th:-120*D,C:{x:10,y:10},E:{x:-60,y:150},a:-150*D,L:250,bend:12}}
function strikePose(u){
  const wp=windPose(),ui=u*u;
  const Ph=lp(wp.Ph,{x:140,y:162},ui),th=lerp(wp.th,-8*D,ui),P0=tipOf(Ph,th),T=sw.T;
  const E=bez(wp.E,{x:180,y:-150},T,ui);
  const Sc={x:(P0.x+T.x)/2+30,y:Math.min(P0.y,T.y)-95};
  const C=lp(wp.C,Sc,Math.pow(u,1.4));
  const aT=Math.atan2(T.y-P0.y,T.x-P0.x);
  return{Ph,th,C,E,a:lerp(wp.a,aT,ui),L:lerp(250,Math.hypot(T.x-P0.x,T.y-P0.y),ui),bend:-Math.sin(Math.PI*u)*28};
}
function mix(A,B,u){return{Ph:lp(A.Ph,B.Ph,u),th:lerp(A.th,B.th,u),C:lp(A.C,B.C,u),E:lp(A.E,B.E,u),a:lerp(A.a,B.a,u),L:lerp(A.L,B.L,u),bend:lerp(A.bend,B.bend,u)}}
function poseNow(){
  switch(sw.phase){
    case 'windup':return mix(sw.from,windPose(),eOut(clamp(sw.t/sw.dW,0,1)));
    case 'strike':return strikePose(clamp(sw.t/sw.dS,0,1));
    case 'hold':return strikePose(1);
    case 'recoil':{
      const u=clamp(sw.t/dR,0,1),P=mix(strikePose(1),restPose(),eOut(u));
      P.bend=Math.sin(u*Math.PI*2)*14*(1-u);
      P.C={x:P.C.x,y:P.C.y+Math.sin(u*Math.PI*3)*30*(1-u)};
      return P;
    }
    default:return restPose();
  }
}
function finalize(P){
  const P0=tipOf(P.Ph,P.th);
  if(WHIPS[cur].id==='cane'){
    const d={x:Math.cos(P.a),y:Math.sin(P.a)},E={x:P0.x+d.x*P.L,y:P0.y+d.y*P.L};
    const m=lp(P0,E,.5);
    return{...P,P0,E,C:{x:m.x-d.y*P.bend,y:m.y+d.x*P.bend}};
  }
  return{...P,P0};
}

/* ---------- audio ---------- */
let AC=null,master=null,noiseBuf=null;
function audio(){
  if(!AC){
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;
    AC=new A();master=AC.createGain();master.gain.value=muted?0:.8;master.connect(AC.destination);
    const n=AC.sampleRate;noiseBuf=AC.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  }
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function noise(t0,dur,type,f,q,g,f2){
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const bf=AC.createBiquadFilter();bf.type=type;bf.frequency.setValueAtTime(f,t0);if(f2)bf.frequency.exponentialRampToValueAtTime(f2,t0+dur);bf.Q.value=q;
  const gn=AC.createGain();gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(g,t0+Math.min(.01,dur*.3));gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(bf).connect(gn).connect(master);s.start(t0,Math.random()*.5);s.stop(t0+dur+.05);
}
function tone(t0,dur,type,f,f2,g){
  const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  const gn=AC.createGain();gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(g,t0+.005);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);

function randomTarget(){return{x:crab.ox+rnd(14,106),y:crab.oy+rnd(10,72)}}
function swing(T){

}
function impact(){
  const w=WHIPS[cur],T=sw.T,P=finalize(strikePose(1));
  let tx=P.E.x-P.C.x,ty=P.E.y-P.C.y;const L=Math.hypot(tx,ty)||1;tx/=L;ty/=L;

  const nd=w.id==='zap'?14:w.id==='thorn'?4:0;
  for(let i=0;i<nd;i++)welt.dots.push(w.id==='zap'?{x:rnd(-16,16),y:rnd(-12,12)}:{s:rnd(-44,44),o:rnd(7,11)*(Math.random()<.5?-1:1)});
  crab.welts.push(welt);if(crab.welts.length>40)crab.welts.shift();

  const nb=6+w.power;

  if(w.id==='chain'||w.id==='zap')for(let i=0;i<12;i++){const a=rnd(0,Math.PI*2),v=rnd(200,420);parts.push({type:'spark',x:T.x,y:T.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.15,.3),age:0,c:w.id==='zap'?'#6FE3FF':'#FFE07A'})}
  if(w.id==='cane')for(let i=0;i<5;i++)parts.push({type:'sq',x:T.x,y:T.y,vx:rnd(-80,160),vy:rnd(-220,-60),life:.6,age:0,size:4,c:'#C9A27A'});

  if(w.id==='zap')for(let i=0;i<7;i++)parts.push({type:'smoke',x:crab.ox+rnd(10,110),y:crab.oy+rnd(0,40),vx:rnd(-10,10),vy:rnd(-50,-25),life:rnd(.8,1.3),age:0,size:rnd(8,14)});

      for(let i=0;i<46;i++)parts.push({type:'conf',x:crab.ox+60,y:crab.oy-10,vx:rnd(-260,260),vy:rnd(-420,-160),life:rnd(1.2,1.8),age:0,rot:rnd(0,6),vr:rnd(-12,12),c:pick(['#F2C14E','#E8833A','#7BB36A','#8EC5E8','#D97757','#C8372D'])});

/* ---------- update ---------- */
function update(dt){
  sw.t+=dt;
  if(sw.phase==='windup'&&sw.t>=sw.dW){sw.phase='strike';sw.t=0;sfxWhoosh()}
  if(sw.phase==='strike'){
    const P=finalize(poseNow()),pts=sample(P.P0,P.C,P.E,24);trails.push({pts,age:0});
    if(sw.t>=sw.dS){sw.phase='hold';sw.t=0;impact();return}
  }
  if(sw.phase==='hold'&&sw.t>=(sw.q.length?.025:dH)){
    if(sw.q.length){sw.from=lastPose||strikePose(1);sw.T=sw.q.shift();sw.phase='windup';sw.t=0;sw.dW=.04;sw.dS=.06}
    else{sw.phase='recoil';sw.t=0}
  }
  if(sw.phase==='recoil'){
    if(sw.q.length){sw.from=lastPose;sw.T=sw.q.shift();sw.phase='windup';sw.t=0;sw.dW=.04;sw.dS=.06}
    else if(sw.t>=dR){sw.phase='rest';sw.t=0}
  }
  const c=crab;
  c.vx+=(-220*c.x-16*c.vx)*dt;c.x+=c.vx*dt;
  c.vy+=(-260*c.y-18*c.vy)*dt;c.y+=c.vy*dt;
  c.vsq+=(-300*c.sq-18*c.vsq)*dt;c.sq+=c.vsq*dt;c.sq=clamp(c.sq,-.25,.25);
  c.hurt=Math.max(0,c.hurt-dt);c.xeye=Math.max(0,c.xeye-dt);c.xray=Math.max(0,c.xray-dt);c.blush=Math.max(0,c.blush-dt);
  c.strugAt-=dt;if(c.strugAt<=0){c.strug=.45;c.strugAt=rnd(3,6)}c.strug=Math.max(0,c.strug-dt);
  c.pain=Math.max(0,c.pain-dt*1.3);
  if(c.flag>0){c.flag-=dt;if(c.flag<=0){c.flag=0;forgive=0;updateCalm()}}
  c.blinkAt-=dt;if(c.blinkAt<=0){c.blink=.12;c.blinkAt=rnd(2.5,5)}c.blink=Math.max(0,c.blink-dt);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.age+=dt;if(p.age>=p.life){parts.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.type==='sq'){p.vy+=900*dt}else if(p.type==='conf'){p.vy+=600*dt;p.vx*=.985;p.rot+=p.vr*dt}else if(p.type==='spark'){p.vx*=.9;p.vy*=.9}else if(p.type==='smoke'){p.size+=dt*10}}
  for(let i=trails.length-1;i>=0;i--){trails[i].age+=dt;if(trails[i].age>.16)trails.splice(i,1)}
  if(tm>nextIdle&&(!bubble||tm>bubble.until)&&sw.phase==='rest'&&!c.flag){say(pick(LINES.idle),2.2);nextIdle=tm+rnd(9,14)}
}

  ctx.font='24px '+FONT;ctx.textAlign='right';ctx.textBaseline='middle';
  ctx.globalAlpha=age>.9?1-(age-.9)/.3:1;
  ctx.fillStyle='#2E2A26';ctx.fillText('连击 ×'+combo,2,2);ctx.fillStyle='#C8372D';ctx.fillText('连击 ×'+combo,0,0);
  ctx.restore();ctx.globalAlpha=1;
}
function render(){
  const k=cv.width/W;ctx.setTransform(k,0,0,k,0,0);
  ctx.fillStyle='#FBF7F1';ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shakeAmt>.3)ctx.translate(rnd(-shakeAmt,shakeAmt),rnd(-shakeAmt,shakeAmt));
  px(-20,296,W+40,H,'#EFE6DA');px(-20,296,W+40,3,'#E2D5C5');
  for(let i=0;i<9;i++)px(30+i*76+(i%2)*20,318+(i%3)*12,6,3,'#E2D5C5');
  drawCrab();drawZapBolts();
  trails.forEach(t=>{const a=1-t.age/.16;ctx.globalAlpha=a*.35;pathPts(ctx,t.pts);ctx.strokeStyle='#A8957F';ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke()});
  ctx.globalAlpha=1;
  const P=finalize(poseNow());
  if(stop<=0)lastPose=poseNow();
  const id=WHIPS[cur].id;drawLash(ctx,id,P.P0,P.C,P.E);drawHandle(ctx,P.Ph,P.th,id);
  drawBursts();drawParts();drawBubble();
  ctx.restore();
  drawCombo();
}
function tick(dt){
  tm+=dt;
  shakeAmt*=Math.exp(-dt*14);crab.flash=Math.max(0,crab.flash-dt);
  if(stop>0)stop-=dt;else update(dt);
  render();
}
function loop(now){
  const t=now/1000;const dt=Math.min(.05,last?t-last:0);last=t;
  tick(dt);
  requestAnimationFrame(loop);
}

/* ---------- UI ---------- */
function resize(){
  const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(r.width*d);cv.height=Math.round(r.width*H/W*d);
  document.querySelectorAll('.whip canvas').forEach((m,i)=>drawMini(m,WHIPS[i].id));
}
function drawMini(m,id){
  const r=m.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);if(!r.width)return;
  m.width=Math.round(r.width*d);m.height=Math.round(r.width/3*d);
  const g=m.getContext('2d'),k=m.width/270;g.setTransform(k,0,0,k,0,0);g.clearRect(0,0,270,90);
  const Ph={x:16,y:60},th=-16*D,P0=tipOf(Ph,th);
  const E={x:254,y:id==='cane'?26:58},C=id==='cane'?lp(P0,E,.5):{x:178,y:-8};
  drawLash(g,id,P0,C,E);drawHandle(g,Ph,th,id);
}
function select(i,quiet){
  cur=i;
  document.querySelectorAll('.whip').forEach((b,j)=>{b.classList.toggle('on',j===i);b.setAttribute('aria-pressed',j===i)});
  document.querySelectorAll('#anger i').forEach((s,j)=>s.style.background=j<=i?WHIPS[j].bar:'');
  const ml=document.getElementById('moodLabel');ml.textContent=WHIPS[i].mood;ml.style.color=WHIPS[i].text;
  if(!quiet)sfxBlip();
}
const box=document.getElementById('whips');
WHIPS.forEach((w,i)=>{
  const b=document.createElement('button');b.type='button';b.className='whip';b.style.setProperty('--c',w.text);
  b.innerHTML='<kbd>'+(i+1)+'</kbd><canvas></canvas><div class="row"><span class="name">'+w.name+'</span><span class="mood">'+w.mood+'</span></div>';
  b.addEventListener('click',()=>select(i));box.appendChild(b);
});
document.getElementById('stage').addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  const inCrab=x>crab.ox-24&&x<crab.ox+144&&y>crab.oy-24&&y<crab.oy+124;
  swing(inCrab?{x:clamp(x,crab.ox+8,crab.ox+112),y:clamp(y,crab.oy+8,crab.oy+76)}:randomTarget());
});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();swing(randomTarget())}
  const n=parseInt(e.key,10);if(n>=1&&n<=WHIPS.length)select(n-1);
});
document.getElementById('mute').addEventListener('click',e=>{
  muted=!muted;e.currentTarget.textContent='音效：'+(muted?'关':'开');if(master)master.gain.value=muted?0:.8;
});
window.addEventListener('resize',resize);
select(cur,true);updateCalm();resize();
if(document.fonts)document.fonts.load('17px "ZCOOL KuaiLe"').then(()=>resize()).catch(()=>{});
requestAnimationFrame(loop);
})();
</script>
</body>
